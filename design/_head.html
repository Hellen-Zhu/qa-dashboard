<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;450;500;600&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────────
   Two rules hold this system together:
   1. Only --ink, --ink2, --ink3 may carry text. Each clears 4.5:1 on both
      --bg and --p1. Everything dimmer is a stroke and never sets colour.
   2. Status has two steps: a mark step for lamps and bars (>=3:1) and an
      ink step for text (>=4.5:1). Never use a mark step as text colour.
   Categorical slots are the validated dark steps (blue/orange/aqua/violet).
   ───────────────────────────────────────────────────────────────────── */
:root{
  --bg:#0E1012; --p1:#15181B; --p2:#1B1F23; --p3:#23282D;
  --ln:#2A3037; --ln2:#1F242A; --ln3:#3A424B;
  --ink:#E9ECEF; --ink2:#AEB5BD; --ink3:#949BA3;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --good-i:#57C96B; --warn-i:#fab219; --crit-i:#EE8A82;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#9085e9; --c0:#7A828B;
  --focus:#7FB2F0;
  --r1:4px; --r2:8px;
  --sans:"IBM Plex Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ln3);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:#fff;text-decoration-color:var(--ink2)}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ── Type ramp: 11 / 12 / 13 / 15 / 20 / 28 / 44. No sizes in between. ── */
.t1{font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.022em;text-wrap:balance}
.t2{font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.016em}
.h2{font-size:15px;line-height:1.3;font-weight:600;letter-spacing:-.008em}
.sub{font-size:12px;color:var(--ink3);text-wrap:pretty}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"zero" 1}
.lbl{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);line-height:1.4}
.fig{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.02em;line-height:1}

/* ── Surfaces: page / plate / flush. Tables are flush, not boxed. ── */
.plate{border:1px solid var(--ln);border-radius:var(--r2);background:var(--p1)}
.flush{border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}

/* ── Signal lamps: good sits quiet, anomalies glow. ── */
.lamp{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.lamp.g{background:var(--good);box-shadow:0 0 0 2.5px rgba(12,163,12,.16)}
.lamp.a{background:var(--warn);box-shadow:0 0 0 2.5px rgba(250,178,25,.14),0 0 10px rgba(250,178,25,.5)}
.lamp.r{background:var(--crit);box-shadow:0 0 0 2.5px rgba(208,59,59,.18),0 0 11px rgba(208,59,59,.62)}
.lamp.o{background:var(--c0)}

.row{transition:background .12s}
.row:hover{background:var(--p2)}
.hov{transition:background .12s,color .12s,border-color .12s}
.hov:hover{background:var(--p2);color:var(--ink)}

/* Keyboard focus was entirely absent before; it is a quality baseline. */
:where(button,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r1)}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--ln3);border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.rise{animation:none}}
</style>
