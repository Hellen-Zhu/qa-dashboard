<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<!--HEAD-->
</helmet>
<div style="height: 100vh; display: grid; grid-template-columns: 212px minmax(0, 1fr); grid-template-rows: 48px minmax(0, 1fr) 30px; background: var(--bg);">

  <header style="grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 0 16px 0 18px; border-bottom: 1px solid var(--ln); background: var(--bg);">
    <div style="display: flex; align-items: center; gap: 10px; width: 178px;">
      <svg width="18" height="18" viewBox="0 0 18 18" style="flex: none;"><rect x="1" y="1" width="16" height="16" rx="4" style="fill: none; stroke: var(--ink); stroke-width: 1.5;"></rect><path d="M5 11.5l2.5-5 2.5 4 1.5-2.5 1.5 3.5" style="fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;"></path></svg>
      <span class="m" style="font-size: 12px; font-weight: 600; letter-spacing: .12em;">GENIE·QA</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <button class="hov" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px; border: 1px solid var(--ln); border-radius: 6px; background: var(--p1); color: var(--ink);">
        <span class="lamp r"></span><span class="m" style="font-size: 12px;">com_scb_oreo_oreo-e2e</span>
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 4l3 3 3-3" style="fill: none; stroke: var(--ink3); stroke-width: 1.4;"></path></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button class="hov" style="display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px dashed var(--ln); border-radius: 6px; background: transparent; color: var(--ink2);">
          <span class="lbl" style="font-size: 10px;">{{ f.k }}</span><span style="font-size: 12px; color: var(--ink);">{{ f.v }}</span>
        </button>
      </sc-for>
    </div>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 14px;">
      <button class="hov" style="display: flex; align-items: center; gap: 10px; height: 28px; width: 240px; padding: 0 8px 0 10px; border: 1px solid var(--ln); border-radius: 6px; background: var(--p1); color: var(--ink3); font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" style="fill: none; stroke: var(--ink3); stroke-width: 1.5;"></circle><path d="M10.5 10.5l3.5 3.5" style="stroke: var(--ink3); stroke-width: 1.5; stroke-linecap: round;"></path></svg>
        <span>Jump to run, TC or signature</span>
        <span class="m" style="margin-left: auto; font-size: 10.5px; padding: 1px 5px; border: 1px solid var(--ln); border-radius: 4px;">⌘K</span>
      </button>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="lamp g"></span><span class="lbl" style="color: var(--ink2);">Synced 16:20</span>
      </div>
    </div>
  </header>

  <nav style="border-right: 1px solid var(--ln); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--bg);">
    <span class="lbl" style="padding: 0 10px 8px;">Workspace</span>
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="7">
      <button onClick="{{ n.go }}" class="hov" style="{{ n.style }}">
        <svg width="16" height="16" viewBox="0 0 16 16" style="flex: none;"><path d="{{ n.icon }}" style="fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;"></path></svg>
        <span style="flex: 1; text-align: left;">{{ n.label }}</span>
        <sc-if value="{{ n.hasCount }}" hint-placeholder-val="{{ false }}">
          <span class="m" style="{{ n.countStyle }}">{{ n.count }}</span>
        </sc-if>
        <span class="m" style="font-size: 10px; color: var(--ink4); width: 10px; text-align: right;">{{ n.key }}</span>
      </button>
    </sc-for>
    <div style="margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--ln2); display: flex; flex-direction: column; gap: 6px;">
      <span class="lbl">Retained here</span>
      <span class="m" style="font-size: 20px; font-weight: 500; letter-spacing: -.02em;">214 <span style="font-size: 12px; color: var(--ink3);">runs</span></span>
      <span style="font-size: 12px; color: var(--ink3); text-wrap: pretty;">91 of them have already expired in Genie.</span>
    </div>
  </nav>

  <main style="overflow: auto; min-height: 0; background: var(--bg);">
    <sc-if value="{{ is.today }}" hint-placeholder-val="{{ true }}"><dc-import name="Today" unclassified="{{ unclassified }}" on-nav="{{ go }}" hint-size="100%,1420px"></dc-import></sc-if>
    <sc-if value="{{ is.runs }}" hint-placeholder-val="{{ false }}"><dc-import name="Runs" hint-size="100%,1100px"></dc-import></sc-if>
    <sc-if value="{{ is.triage }}" hint-placeholder-val="{{ false }}"><dc-import name="Triage" cats="{{ cats }}" on-classify="{{ classify }}" on-nav="{{ go }}" hint-size="100%,1100px"></dc-import></sc-if>
    <sc-if value="{{ is.flaky }}" hint-placeholder-val="{{ false }}"><dc-import name="Flaky" hint-size="100%,900px"></dc-import></sc-if>
    <sc-if value="{{ is.cases }}" hint-placeholder-val="{{ false }}"><dc-import name="Cases" hint-size="100%,1000px"></dc-import></sc-if>
    <sc-if value="{{ is.gate }}" hint-placeholder-val="{{ false }}"><dc-import name="Gate" cats="{{ cats }}" waived="{{ waived }}" on-waive="{{ waive }}" on-nav="{{ go }}" hint-size="100%,1000px"></dc-import></sc-if>
    <sc-if value="{{ is.sync }}" hint-placeholder-val="{{ false }}"><dc-import name="Sync" hint-size="100%,900px"></dc-import></sc-if>
  </main>

  <footer class="m" style="grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; padding: 0 18px; border-top: 1px solid var(--ln); font-size: 11px; color: var(--ink3); background: var(--bg);">
    <span style="display: flex; align-items: center; gap: 7px;"><span class="lamp g" style="width: 6px; height: 6px;"></span>genie-report-host</span>
    <span>19,860 scenario results</span>
    <span>token valid 6d</span>
    <span>next sync 17:00</span>
    <span style="margin-left: auto;">1–7 switch view</span>
  </footer>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900},"startPage":{"editor":"enum","options":["today","runs","triage","flaky","cases","gate","sync"],"default":"today"}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      page: null,
      cats: { conn: 'env', locator: 'defect', timeout: 'script', ws: null },
      waived: false
    };
    this.onKey = (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      const i = '1234567'.indexOf(e.key);
      if (i >= 0) this.setState({ page: Component.PAGES[i].id });
    };
  }
  componentDidMount() { window.addEventListener('keydown', this.onKey); }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const page = this.state.page ?? this.props.startPage ?? 'today';
    const cats = this.state.cats;
    const unclassified = Object.values(cats).filter((c) => !c).length;
    const go = (id) => this.setState({ page: id });
    const counts = { triage: unclassified, flaky: 6 };
    const nav = Component.PAGES.map((p, i) => {
      const on = p.id === page;
      const c = counts[p.id];
      return {
        ...p,
        key: String(i + 1),
        go: () => go(p.id),
        hasCount: c !== undefined && c !== null && c > 0,
        count: c,
        countStyle: 'font-size: 10.5px; padding: 0 6px; border-radius: 9px; line-height: 17px; ' + (p.id === 'triage' ? 'background: rgba(208,59,59,.18); color: #F2A19B;' : 'background: var(--p3); color: var(--ink2);'),
        style: 'display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 6px; font-size: 13px; ' + (on ? 'background: var(--p2); color: var(--ink); font-weight: 500; box-shadow: inset 0 0 0 1px var(--ln);' : 'background: transparent; color: var(--ink2);')
      };
    });
    const is = {};
    Component.PAGES.forEach((p) => { is[p.id] = p.id === page; });
    return {
      nav, is, cats, unclassified, go,
      waived: this.state.waived,
      waive: (v) => this.setState({ waived: v }),
      classify: (sig, cat) => this.setState({ cats: { ...this.state.cats, [sig]: cat } }),
      filters: [{ k: 'Release', v: 'All' }, { k: 'Range', v: '180 days' }, { k: 'Label', v: 'All' }, { k: 'Branch', v: 'Any' }]
    };
  }
}
Component.PAGES = [
  { id: 'today', label: 'Today', icon: 'M1.5 8.5h3l2-5 3 9 2-4h3' },
  { id: 'runs', label: 'Runs', icon: 'M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01' },
  { id: 'triage', label: 'Triage', icon: 'M8 1.5v3M8 11.5v3M1.5 8h3M11.5 8h3M8 5.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5' },
  { id: 'flaky', label: 'Stability', icon: 'M1.5 10l3-5 3 6 3-6 3 5' },
  { id: 'cases', label: 'Test cases', icon: 'M2.5 2.5h4v4h-4zM9.5 2.5h4v4h-4zM2.5 9.5h4v4h-4zM9.5 9.5h4v4h-4z' },
  { id: 'gate', label: 'Release gate', icon: 'M3.5 14.5v-12M3.5 3h9l-2 3 2 3h-9' },
  { id: 'sync', label: 'Data sync', icon: 'M13.5 6.5A5.5 5.5 0 0 0 3.2 5M2.5 9.5a5.5 5.5 0 0 0 10.3 1.5M3 2v3h3M13 14v-3h-3' }
];
</script>
</body>
</html>
